<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fff8f4">
  <title>Chollos de Janella</title>
  <style>
    :root{--ink:#24222a;--muted:#716b78;--pink:#e64776;--pale:#fff8f4;--line:#eee3e3;--lav:#f2eaff;--green:#0b7558;--amber:#a45e00}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(145deg,#ffdfeb 0,#fff8f4 43%,#f3ecff 100%);color:var(--ink);font:16px/1.42 system-ui,-apple-system,"Segoe UI",sans-serif}.skip{position:absolute;left:-9999px}.skip:focus{left:12px;top:12px;z-index:9;padding:11px;background:#fff;color:#111;border-radius:10px;outline:3px solid #5f20a5}a:focus-visible,button:focus-visible{outline:3px solid #5f20a5;outline-offset:3px}main{max-width:1120px;margin:auto;padding:22px 16px 48px}header{text-align:center;padding:24px 8px 18px}.eyebrow{font-size:.75rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--pink)}h1{margin:5px 0 8px;font-size:clamp(2.25rem,7vw,4.25rem);line-height:.96;letter-spacing:-.07em}.intro{max-width:560px;margin:0 auto;color:var(--muted)}.location-tabs{display:flex;gap:9px;overflow:auto;padding:8px 0 16px;scrollbar-width:none}.location-tabs button{flex:0 0 auto;border:1px solid #e7d9dc;border-radius:999px;background:#fff;color:var(--ink);padding:10px 14px;font:800 .84rem inherit;cursor:pointer}.location-tabs button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}.layout{display:grid;gap:18px}.side{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:22px;padding:14px}.side h2{margin:2px 5px 10px;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.shop-list{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.shop-list button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px;text-align:left;color:var(--ink);font:700 .83rem inherit;cursor:pointer}.shop-list button.active{background:var(--lav);border-color:#caaaff;color:#461482}.content-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:4px 2px 12px}.content-head h2{margin:0;font-size:1.25rem;letter-spacing:-.03em}.counter{margin:0;color:var(--muted);font-size:.82rem}.cards{display:grid;gap:11px}.card{position:relative;overflow:hidden;min-height:190px;padding:18px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:22px;box-shadow:0 7px 20px rgba(65,30,45,.06)}.card:after{content:"";position:absolute;width:100px;height:100px;right:-42px;top:-44px;border-radius:50%;background:#ffe2eb}.place{display:inline-block;margin:0 0 5px;color:#7f4ca5;font-weight:900;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}.card h3{position:relative;z-index:1;margin:0;font-size:1.3rem;letter-spacing:-.04em}.status{display:inline-block;margin:10px 0 8px;border-radius:999px;padding:5px 8px;font-size:.69rem;font-weight:900}.live{background:#dcf5e9;color:var(--green)}.soon{background:#fff0d5;color:var(--amber)}.neutral{background:#eeeeF4;color:#666270}.desc{margin:0;color:var(--muted);font-size:.91rem}.button{display:flex;align-items:center;justify-content:center;min-height:42px;margin-top:14px;border-radius:13px;background:var(--ink);color:#fff;text-decoration:none;font-weight:850;font-size:.9rem}.button:hover{background:var(--pink)}.empty{padding:34px;text-align:center;background:#fff;border:1px dashed #d7c9cf;border-radius:20px;color:var(--muted)}.footer{max-width:700px;margin:27px auto 0;text-align:center;color:var(--muted);font-size:.76rem}@media(min-width:700px){main{padding:38px 24px 56px}.layout{grid-template-columns:220px 1fr;align-items:start}.side{position:sticky;top:15px}.shop-list{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}.location-tabs{justify-content:center}.card{min-height:205px}}@media(min-width:960px){.cards{grid-template-columns:repeat(3,1fr)}}
  </style>
</head>
<body>
  <a class="skip" href="#results">Saltar a las tiendas</a>
  <main>
    <header><div class="eyebrow">Guía de compras · Cantabria</div><h1>Chollos de Janella ✨</h1><p class="intro">Elige una zona o entra directamente en tu tienda favorita.</p></header>
    <nav class="location-tabs" aria-label="Filtrar por ubicación">
      <button data-location="all" aria-pressed="true">✨ Todo</button>
      <button data-location="eci" aria-pressed="false">El Corte Inglés</button>
      <button data-location="valle" aria-pressed="false">Valle Real</button>
      <button data-location="centro" aria-pressed="false">Centro Santander</button>
    </nav>
    <section class="layout">
      <aside class="side" aria-label="Menú por tienda"><h2>Tiendas</h2><div class="shop-list" id="shop-menu"></div></aside>
      <section id="results" aria-live="polite"><div class="content-head"><h2 id="view-title">Todo para mirar</h2><p class="counter" id="counter"></p></div><div class="cards" id="cards"></div></section>
    </section>
    <p class="footer">Pulsa “Abrir tienda” para consultar stock, horario y oferta antes de salir. Actualizado el 25/11/2026.</p>
  </main>
  <script>
    // Para actualizar: añade una tienda con nombre, zona, estado, texto y enlace.
    const stores=[
      {name:'El Corte Inglés',zone:'eci',area:'El Corte Inglés · Bahía de Santander',status:'Multimarca',tone:'live',desc:'Moda, zapatos y complementos de muchas marcas para probarlo todo en una visita.',url:'https://centroscomerciales.elcorteingles.com/centroscomerciales/es/eci/centros/centro-comercial-bahia-de-santander'},
      {name:'Sfera',zone:'eci',area:'El Corte Inglés · Bahía de Santander',status:'En tienda',tone:'neutral',desc:'Opción económica dentro del mismo centro: útil para básicos, vestidos y accesorios.',url:'https://www.elcorteingles.es/centroscomerciales/es/sfera/centros/sfera-el-corte-ingles-santander'},
      {name:'Mango',zone:'valle',area:'Valle Real · Maliaño',status:'Hasta -50% online',tone:'live',desc:'Black Friday en artículos seleccionados. Comprueba si su talla está en Valle Real antes de ir.',url:'https://www.centrovallereal.com/tiendas/'},
      {name:'H&M',zone:'valle',area:'Valle Real · Maliaño',status:'Hasta -40% app',tone:'live',desc:'La oferta para miembros funciona desde la app; lleva guardados los favoritos para probarlos allí.',url:'https://www.centrovallereal.com/tiendas/'},
      {name:'Zara',zone:'valle',area:'Valle Real · Maliaño',status:'Special Prices',tone:'live',desc:'Precios especiales en una selección. Buena parada para revisar abrigos, zapatos y punto.',url:'https://www.centrovallereal.com/tiendas/'},
      {name:'Primark',zone:'valle',area:'Valle Real · Maliaño',status:'Precio bajo',tone:'neutral',desc:'Para básicos y complementos baratos; mejor comprobar calidad y composición en persona.',url:'https://www.centrovallereal.com/tiendas/'},
      {name:'Stradivarius',zone:'valle',area:'Valle Real · Maliaño',status:'Tendencias',tone:'neutral',desc:'Ideal para prendas más de tendencia y para comparar antes de comprar online.',url:'https://www.centrovallereal.com/tiendas/'},
      {name:'Pull&Bear',zone:'valle',area:'Valle Real · Maliaño',status:'Tendencias',tone:'neutral',desc:'Buena opción para denim, sudaderas y básicos informales.',url:'https://www.centrovallereal.com/tiendas/'},
      {name:'Oysho',zone:'valle',area:'Valle Real · Maliaño',status:'Deporte y básicos',tone:'neutral',desc:'Para ropa deportiva, ropa interior y prendas cómodas.',url:'https://www.centrovallereal.com/tiendas/'},
      {name:'Brownie',zone:'centro',area:'Centro Santander · Juan Herrera 12',status:'Black Friday pendiente',tone:'soon',desc:'Tienda física en el centro; si activa la campaña, será la mejor para looks más especiales.',url:'https://www.browniespain.com/es-de/pages/localizacion-de-tiendas'},
      {name:'Mango Centro',zone:'centro',area:'Centro Santander · Lealtad 14',status:'Hasta -50% online',tone:'live',desc:'Tienda Mango del centro para ver en persona las prendas de la promoción y probar talla.',url:'https://shop.mango.com/es/es/stores/santander/clealtad-14/13614'}
    ];
    const labels={all:'Todo para mirar',eci:'El Corte Inglés · Bahía de Santander',valle:'Valle Real · Maliaño',centro:'Centro Santander'};
    let location='all', shop='all';
    const cards=document.querySelector('#cards'),menu=document.querySelector('#shop-menu'),counter=document.querySelector('#counter'),title=document.querySelector('#view-title');
    const clean=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function render(){const names=[...new Set(stores.map(s=>s.name))];menu.innerHTML=`<button class="${shop==='all'?'active':''}" data-shop="all">Todas</button>`+names.map(n=>`<button class="${shop===n?'active':''}" data-shop="${clean(n)}">${clean(n)}</button>`).join('');const visible=stores.filter(s=>(location==='all'||s.zone===location)&&(shop==='all'||s.name===shop));title.textContent=shop==='all'?labels[location]:shop;counter.textContent=`${visible.length} ${visible.length===1?'tienda':'tiendas'}`;cards.innerHTML=visible.length?visible.map(s=>`<article class="card"><span class="place">${clean(s.area)}</span><h3>${clean(s.name)}</h3><span class="status ${s.tone}">${clean(s.status)}</span><p class="desc">${clean(s.desc)}</p><a class="button" href="${s.url}" target="_blank" rel="noopener">Abrir tienda →</a></article>`).join(''):'<p class="empty">No hay tiendas con esos filtros. Prueba otra ubicación.</p>';menu.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{shop=b.dataset.shop;render()}));}
    document.querySelectorAll('[data-location]').forEach(b=>b.addEventListener('click',()=>{location=b.dataset.location;shop='all';document.querySelectorAll('[data-location]').forEach(x=>x.setAttribute('aria-pressed',x===b));render()}));render();
  </script>
</body>
</html>
